services:
  postgres:
    image: postgres:16-alpine
    container_name: spacesync_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-spacesync_dev_password}
      POSTGRES_DB: spacesync_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
